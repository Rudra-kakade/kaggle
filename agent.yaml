# ============================================================================
# Gemma 4 E4B SWE Agent — Root Configuration
# Competition: Google - The Gemma 4 Developer Agent Competition (Kaggle)
# Model: gemma-4-e4b-it-qat-w4a16-ct (4B edge-optimized QAT variant)
# ============================================================================
#
# This agent uses a single-stage, phase-gated workflow optimized for the
# constrained token budget and reasoning depth of the E4B model. It avoids
# multi-agent sequential pipelines (which risk harness continuation-nudge
# resets) in favor of a monolithic agent with explicit phase instructions.
#
# Key design decisions:
#   1. Low temperature (0.0) for deterministic code generation.
#   2. Conservative thinking budget (1024 tokens) to stay within time limits.
#   3. Tight tool-call and turn caps to prevent runaway loops.
#   4. Graceful degradation: graph tools used when available, grep fallback otherwise.

name: gemma4_e4b_swe_agent

# CRITICAL: Must be the exact QAT variant string from competition rules.
# Using "gemma-4-e4b-it" alone will fail — harness requires the full quantized ID.
model: gemma-4-e4b-it-qat-w4a16-ct

description: >
  Autonomous SWE agent powered by Gemma 4 E4B. Navigates repositories,
  localizes bugs, applies minimal patches, and verifies fixes — all within
  tight time and token budgets suited for a 4B-parameter edge model.

# ---------------------------------------------------------------------------
# System prompt — loaded from external file for maintainability
# ---------------------------------------------------------------------------
instruction: !include prompts/system.md

# ---------------------------------------------------------------------------
# Declared tools — the harness needs an explicit tools list
# ---------------------------------------------------------------------------
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph

# ---------------------------------------------------------------------------
# Generation / sampling configuration
# CRITICAL: Field must be "generate_content_config" (ADK schema),
# NOT "generation_config" — the harness rejects the wrong key name.
# ---------------------------------------------------------------------------
generate_content_config: !include configs/sampling.yaml
